<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Veynod · Inbox & approvals</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 26px 30px 48px; font-family: "Segoe UI", system-ui, sans-serif;
        color: #ece9ff; background: #0e0d16;
      }
      header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
      h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.02em; }
      h2 { font-size: 14px; margin: 0 0 10px; color: #c9c4e8; }
      .sub { color: #a9a4c8; font-size: 13px; line-height: 1.5; }
      button {
        border: 0; border-radius: 8px; padding: 8px 13px; font: inherit; font-weight: 600;
        color: #fff; background: #6c5ce7; cursor: pointer;
      }
      button.secondary { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
      button:disabled { opacity: .45; cursor: default; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      section { margin-bottom: 26px; }
      .item, .review {
        background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
        border-radius: 12px; padding: 12px 14px; margin-bottom: 9px;
      }
      .item.terminal { border-left: 3px solid #ff8f8f; }
      .item strong, .review strong { margin-right: 6px; }
      .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
        background: rgba(108,92,231,.25); margin-left: 6px; }
      .when { color: #7f7a9d; font-size: 12px; }
      .error { color: #ff9d9d; font-size: 13px; white-space: pre-wrap; margin-top: 8px; }
      .empty { color: #a9a4c8; font-size: 13px; }
      textarea {
        width: 100%; min-height: 58px; margin-top: 8px; padding: 9px 10px; font: inherit;
        color: #ece9ff; background: #0e0d16; border: 1px solid rgba(255,255,255,.16);
        border-radius: 8px; resize: vertical;
      }
      label.ok { display: block; color: #c9c4e8; font-size: 13px; padding: 4px 0; }
      label.ok input { margin-right: 7px; }
      .actions { display: flex; gap: 8px; align-items: center; margin-top: 9px; flex-wrap: wrap; }
      .verdict { font-size: 13px; color: #9be3b0; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Inbox &amp; approvals</h1>
        <div class="sub">Directed events and pending verdicts from Veynod. Message bodies stay on the server; open the console for conversations.</div>
      </div>
      <div class="row">
        <button id="refresh" class="secondary">Refresh</button>
        <button id="console" class="secondary">Open console</button>
      </div>
    </header>

    <section>
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Inbox <span id="inbox-count" class="sub"></span></h2>
        <button id="ack" class="secondary">Mark all read</button>
      </div>
      <div id="inbox"></div>
      <div id="inbox-error" class="error"></div>
    </section>

    <section>
      <h2>Pending approvals <span id="review-count" class="sub"></span></h2>
      <div id="reviews"></div>
      <div id="review-error" class="error"></div>
    </section>

    <script>
      const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
      const $ = (id) => document.getElementById(id);
      const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
      let inboxHead = 0;

      function when(value) {
        try { return new Date(value).toLocaleString(); } catch { return String(value || ""); }
      }

      async function loadInbox() {
        $("inbox-error").textContent = "";
        try {
          const data = await invoke("local_inbox");
          inboxHead = Number(data.acked_event_seq || 0);
          const items = data.items || [];
          $("inbox-count").textContent = data.unacked_count ? `· ${data.unacked_count} unread` : "· clear";
          $("ack").disabled = !items.length;
          $("inbox").innerHTML = items.length
            ? items.map((item) => `
              <div class="item ${item.priority === 0 ? "terminal" : ""}">
                <strong>${esc(item.kind)}</strong>
                ${item.task_key ? `<span class="tag">${esc(item.task_key)}</span>` : ""}
                ${item.doc_key ? `<span class="tag">${esc(item.doc_key)}</span>` : ""}
                <span class="sub">${item.actor ? "by " + esc(item.actor) : ""}${item.note ? " · " + esc(item.note) : ""}</span>
                <div class="when">${esc(when(item.created_at))} · seq ${esc(item.event_seq)}</div>
              </div>`).join("")
            : '<div class="empty">Nothing unread. The inbox only carries changes addressed to this agent.</div>';
        } catch (error) {
          $("inbox-error").textContent = String(error);
        }
      }

      async function loadReviews() {
        $("review-error").textContent = "";
        try {
          const data = await invoke("local_reviews");
          const tasks = (data.items || []).slice(0, 20);
          $("review-count").textContent = tasks.length ? `· ${tasks.length} waiting` : "· none";
          if (!tasks.length) {
            $("reviews").innerHTML = '<div class="empty">No task is waiting for a verdict.</div>';
            return;
          }
          const details = await Promise.all(tasks.map((task) =>
            invoke("task_detail", { taskKey: task.task_key }).then((value) => value.task || value).catch((error) => ({ error: String(error), task_key: task.task_key }))
          ));
          $("reviews").innerHTML = details.map((task, index) => {
            if (task.error) {
              return `<div class="review"><strong>${esc(tasks[index].task_key)}</strong><div class="error">${esc(task.error)}</div></div>`;
            }
            const acceptance = task.acceptance || [];
            const checks = acceptance.map((item, itemIndex) => `
              <label class="ok"><input type="checkbox" data-task="${esc(task.task_key)}" data-item="${esc(item.id ?? itemIndex)}" /> ${esc(item.text || item.id || "acceptance item")}</label>`).join("");
            return `
              <div class="review" data-review="${esc(task.task_key)}" data-version="${esc(task.version || "")}">
                <div><strong>${esc(task.task_key)}</strong><span class="sub">${esc(task.title || "")}</span></div>
                <div class="sub">${esc(task.status)}${task.claimed_by ? " · claimed by " + esc(task.claimed_by) : ""}${task.review_round ? " · round " + esc(task.review_round) : ""}</div>
                ${acceptance.length ? `<div style="margin-top:8px">${checks}</div>` : '<div class="sub" style="margin-top:8px">This task has no acceptance items; a verdict is still recorded.</div>'}
                <textarea data-feedback="${esc(task.task_key)}" placeholder="Verdict note (required to reject)"></textarea>
                <div class="actions">
                  <button data-approve="${esc(task.task_key)}">Approve</button>
                  <button class="secondary" data-reject="${esc(task.task_key)}">Reject</button>
                  <span class="verdict" data-verdict="${esc(task.task_key)}"></span>
                </div>
              </div>`;
          }).join("");
          wireReviews();
        } catch (error) {
          $("reviews").innerHTML = "";
          $("review-error").textContent = String(error);
        }
      }

      function wireReviews() {
        document.querySelectorAll("[data-approve]").forEach((button) => {
          button.addEventListener("click", () => submitVerdict(button.dataset.approve, "approve"));
        });
        document.querySelectorAll("[data-reject]").forEach((button) => {
          button.addEventListener("click", () => submitVerdict(button.dataset.reject, "reject"));
        });
      }

      async function submitVerdict(taskKey, decision) {
        const review = document.querySelector(`[data-review="${CSS.escape(taskKey)}"]`);
        if (!review) return;
        const result = review.querySelector(`[data-verdict="${CSS.escape(taskKey)}"]`);
        result.textContent = "";
        const feedback = review.querySelector(`[data-feedback="${CSS.escape(taskKey)}"]`).value.trim();
        if (decision === "reject" && !feedback) {
          result.textContent = "Reject needs a note.";
          return;
        }
        const checks = [...review.querySelectorAll('input[type="checkbox"]')];
        if (decision === "approve" && checks.some((input) => !input.checked)) {
          result.textContent = "Tick every acceptance item before approving.";
          return;
        }
        const items = checks.map((input) => ({ item_id: input.dataset.item, result: decision === "approve" ? "PASS" : "FAIL" }));
        const buttons = review.querySelectorAll("button");
        buttons.forEach((button) => { button.disabled = true; });
        try {
          const value = await invoke("review_task", {
            taskKey,
            decision,
            feedback: feedback || null,
            items,
            expectedVersion: review.dataset.version ? Number(review.dataset.version) : null,
          });
          result.textContent = `Recorded: ${value.status || decision}${value.effective_status ? " → " + value.effective_status : ""}`;
          setTimeout(() => { loadReviews(); loadInbox(); }, 700);
        } catch (error) {
          result.textContent = String(error);
          buttons.forEach((button) => { button.disabled = false; });
        }
      }

      $("ack").addEventListener("click", async () => {
        try {
          await invoke("ack_inbox", { upToEventSeq: inboxHead });
          loadInbox();
        } catch (error) {
          $("inbox-error").textContent = String(error);
        }
      });
      $("refresh").addEventListener("click", () => { loadInbox(); loadReviews(); });
      $("console").addEventListener("click", () => invoke("open_dashboard"));
      loadInbox();
      loadReviews();
    </script>
  </body>
</html>
