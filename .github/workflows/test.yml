name: Test

# The product lives in AgentGraph/ since the monorepo move; GitHub only runs
# workflows from the repository root, so paths below are relative to it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentgraph
          POSTGRES_PASSWORD: agentgraph
          POSTGRES_DB: agentgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentgraph -d agentgraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://agentgraph:agentgraph@localhost:5432/agentgraph
    defaults:
      run:
        working-directory: AgentGraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            AgentGraph/requirements*.txt
            veynod_kernel/requirements.txt
      # The Kernel delivery tests start the real Kernel, so its requirements
      # are installed beside the product's.
      - run: pip install -r requirements-dev.txt -r ../veynod_kernel/requirements.txt
      - run: ruff check app tests
      - run: pytest -q --maxfail=5

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix AgentGraph/cli

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentGraph/protocol/package-lock.json
      - run: npm ci --prefix AgentGraph/protocol
      - run: npm test --prefix AgentGraph/protocol

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentGraph/dashboard/package-lock.json
      - run: npm ci --prefix AgentGraph/dashboard
      - run: npm run build --prefix AgentGraph/dashboard
