name: Release

# Deploy gate v2: after CI is green on main, push the images of the merged
# commit to GHCR and tell Veynod, which deploys them where the project's
# deploy target says (docs/DEPLOYS.md).
#
# Incremental: a service is built only when no image carries the content hash
# of what it is built from (scripts/release.py); otherwise the existing image
# is retagged. Builds share the BuildKit cache (type=gha, one scope per
# service), and every Dockerfile installs dependencies before copying code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - uses: docker/setup-buildx-action@v3
      # `docker buildx build --cache-to type=gha` from a script needs the
      # runtime token and cache URL that actions normally keep to themselves.
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build what changed, retag the rest, post the release
        env:
          # The project's deploy target issues the token (console or
          # POST /v1/projects/{p}/deploys/{target}/release-token).
          VEYNOD_HOST: ${{ vars.VEYNOD_HOST || 'https://veynod.com' }}
          VEYNOD_RELEASE_TOKEN: ${{ secrets.VEYNOD_RELEASE_TOKEN }}
        run: python scripts/release.py --commit "$COMMIT" --branch main
