name: Release

# Deploy gate v2: after CI is green on main, push the images of the merged
# commit to GHCR and tell Veynod, which deploys them where the project's
# deploy target says (docs/DEPLOYS.md).
#
# Incremental: a service is built only when no image carries the content hash
# of what it is built from (scripts/release.py); otherwise the existing image
# is retagged. Builds share the BuildKit cache (type=gha, one scope per
# service), and every Dockerfile installs dependencies before copying code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      # The server numbers releases in the order they arrive, so a release
      # for an older commit (a re-run of an old CI run, or CI runs finishing
      # out of order) would count as the newest and auto targets would deploy
      # it over newer code. Only the head of main is released from CI; when
      # main has moved on, the newer commit's own CI run releases it. A run
      # started by hand (workflow_dispatch) is a person's choice and is kept.
      - name: Release only the head of main
        id: head
        if: github.event_name == 'workflow_run'
        run: |
          git fetch --no-tags --depth=1 origin main
          head="$(git rev-parse FETCH_HEAD)"
          if [ "$head" != "$COMMIT" ]; then
            echo "::notice::Not releasing $COMMIT: main is at $head, whose CI run releases it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.head.outputs.skip != 'true'
        run: pip install pyyaml==6.0.2
      - if: steps.head.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      # `docker buildx build --cache-to type=gha` from a script needs the
      # runtime token and cache URL that actions normally keep to themselves.
      - if: steps.head.outputs.skip != 'true'
        uses: crazy-max/ghaction-github-runtime@v3
      - if: steps.head.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build what changed, retag the rest, post the release
        if: steps.head.outputs.skip != 'true'
        env:
          # The project's deploy target issues the token (console or
          # POST /v1/projects/{p}/deploys/{target}/release-token).
          VEYNOD_HOST: ${{ vars.VEYNOD_HOST || 'https://veynod.com' }}
          VEYNOD_RELEASE_TOKEN: ${{ secrets.VEYNOD_RELEASE_TOKEN }}
        run: python scripts/release.py --commit "$COMMIT" --branch main
