<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Veynod Promo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<!--
  Veynod 50s promo. Every frame is a pure function of time: render(t) draws
  timestamp t (seconds). Open in a browser for a live preview, or run
  promo/render.js to export frames to an MP4.
-->
<style>
  :root {
    --bg: #080a0e; --panel: #12161e; --raised: #171d27; --line: #232d3b;
    --text: #eef2f8; --muted: #a7b3c5; --faint: #8a97a9;
    --violet: #8B7CFF; --violet-soft: #c4b5fd; --indigo: #4f46e5;
    --scout: #38d9f0; --analyst: #ffb547; --auditor: #4ade80; --executor: #ff6b9d;
    --danger: #ff5370; --amber: #fcd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Noto Sans SC", "WenQuanYi Zen Hei", "PingFang SC", sans-serif; color: var(--text); }
  .mono { font-family: "JetBrains Mono", "Noto Sans SC", "DejaVu Sans Mono", "WenQuanYi Zen Hei Mono", monospace; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bgglow { position: absolute; inset: 0; }
  #grid { position: absolute; inset: -60px; opacity: .35;
    background-image: linear-gradient(rgba(139,124,255,.08) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(139,124,255,.08) 1px, transparent 1px);
    background-size: 60px 60px; }
  #tint { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,40,70,.0), rgba(255,40,70,.55)); opacity: 0; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .scene { position: absolute; inset: 0; display: none; }
  .a { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
  .h1 { font-size: 92px; font-weight: 700; letter-spacing: 2px; }
  .h2 { font-size: 52px; color: var(--muted); }
  .h3 { font-size: 40px; color: var(--muted); }
  .caret::after { content: "▍"; color: var(--violet); }

  /* ---------- bots ---------- */
  .bot { width: 170px; height: 210px; }
  .bot .ant { position: absolute; left: 81px; top: 0; width: 8px; height: 34px; background: var(--c); border-radius: 4px; opacity: .8; }
  .bot .ant::before { content: ""; position: absolute; left: -8px; top: -14px; width: 24px; height: 24px; border-radius: 50%; background: var(--c); box-shadow: 0 0 24px var(--c); }
  .bot .head { position: absolute; left: 0; top: 30px; width: 170px; height: 132px; border-radius: 40px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 92%, white), color-mix(in srgb, var(--c) 70%, black));
    box-shadow: 0 18px 50px color-mix(in srgb, var(--c) 35%, transparent), inset 0 -8px 0 rgba(0,0,0,.15); }
  .bot .face { position: absolute; left: 20px; top: 22px; width: 130px; height: 84px; border-radius: 26px; background: #0b0f17; }
  .bot .eye { position: absolute; top: 22px; width: 24px; height: 36px; border-radius: 12px; background: #fff; box-shadow: 0 0 14px var(--c); display: flex; align-items: center; justify-content: center; }
  .bot .eye.l { left: 30px; } .bot .eye.r { right: 30px; }
  .bot.happy .eye { height: 16px; top: 34px; border-radius: 16px 16px 4px 4px; }
  .bot.sad .eye { height: 12px; top: 40px; border-radius: 4px 4px 12px 12px; }
  .bot.dizzy .eye { background: none; box-shadow: none; color: #fff; font-size: 40px; font-weight: 900; text-shadow: 0 0 10px var(--c); }
  .bot.dizzy .eye::after { content: "✕"; }
  .bot .tag { position: absolute; left: 50%; top: 172px; transform: translateX(-50%); padding: 6px 16px; border-radius: 999px;
    font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
    border: 2px solid color-mix(in srgb, var(--c) 45%, transparent); }

  .human { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2a2f55, #141830);
    border: 5px solid var(--violet); box-shadow: 0 0 40px rgba(139,124,255,.5); display: flex; align-items: center; justify-content: center; font-size: 84px; }

  /* ---------- generic cards ---------- */
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .doc { width: 420px; height: 280px; padding: 28px 30px; }
  .doc .dt { font-size: 30px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .doc .ln { height: 14px; border-radius: 7px; background: #2a3445; margin-top: 22px; }
  .pill { display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: 22px; font-weight: 700; }
  .stamp { font-size: 64px; font-weight: 900; padding: 10px 30px; border: 8px solid currentColor; border-radius: 18px; letter-spacing: 4px; }
  .bubble { padding: 16px 26px; border-radius: 24px; font-size: 34px; font-weight: 700; background: #fff; color: #111; }
  .chip { padding: 12px 24px; border-radius: 14px; font-size: 30px; font-weight: 700; }

  .ftitle .num { font-size: 34px; color: var(--violet); font-weight: 700; letter-spacing: 6px; }
  .ftitle .zh { font-size: 96px; font-weight: 700; margin-top: 8px; }
  .ftitle .en { font-size: 30px; color: var(--faint); letter-spacing: 3px; margin-top: 6px; }
  .ftitle .desc { font-size: 36px; color: var(--muted); margin-top: 34px; line-height: 1.55; white-space: normal; width: 640px; }

  .col { width: 280px; height: 560px; border-radius: 22px; background: rgba(23,29,39,.7); border: 2px dashed var(--line); }
  .col .ch { text-align: center; font-size: 30px; font-weight: 700; color: var(--muted); padding-top: 20px; }
  .task { width: 240px; height: 110px; padding: 18px 20px; font-size: 28px; font-weight: 700; }
  .task .who { margin-top: 12px; font-size: 20px; }

  .layer { width: 1180px; height: 150px; border-radius: 26px; display: flex; flex-direction: column; justify-content: center; padding: 0 50px; border: 2px solid; }
  .layer .lt { font-size: 44px; font-weight: 700; }
  .layer .ls { font-size: 26px; color: var(--muted); margin-top: 8px; }

  .term { width: 1040px; border-radius: 22px; background: #05070b; border: 2px solid var(--line); overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  .term .bar { height: 50px; background: #121722; display: flex; align-items: center; gap: 12px; padding-left: 22px; }
  .term .bar i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .term .body { padding: 30px 36px; font-size: 38px; line-height: 1.6; min-height: 170px; white-space: pre; }
</style>
</head>
<body>
<div id="stage">
  <div id="bgglow"></div>
  <div id="grid"></div>
  <div id="scenes"></div>
  <div id="tint"></div>
  <div id="flash"></div>
</div>
<div id="glyphs" style="position:absolute;visibility:hidden;white-space:pre;top:0;left:0"></div>

<script>
// ---------- math helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const $ = id => document.getElementById(id);

// Place an element by its centre point.
function place(el, x, y, s = 1, r = 0, o = 1) {
  el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${r}deg)`;
  el.style.opacity = o;
}
// Pop-in: scale with overshoot, starting at time a.
const pop = (t, a, d = .45) => back(prog(t, a, a + d));
const fade = (t, a, b, fi = .3, fo = .3) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
function type(el, str, p) {
  const n = Math.floor(Array.from(str).length * clamp(p));
  el.textContent = Array.from(str).slice(0, n).join('');
  el.classList.toggle('caret', p > 0 && p < 1);
}

// ---------- components ----------
const COLORS = { SCOUT: 'var(--scout)', ANALYST: 'var(--analyst)', AUDITOR: 'var(--auditor)', EXECUTOR: 'var(--executor)' };
const bot = (id, color, label = '') => `
  <div id="${id}" class="a bot" style="--c:${color}">
    <div class="ant"></div>
    <div class="head"><div class="face"><div class="eye l"></div><div class="eye r"></div></div></div>
    ${label ? `<div class="tag">${label}</div>` : ''}
  </div>`;
function mood(el, t, m = '', seed = 0) {
  el.className = 'a bot' + (m ? ' ' + m : '');
  if (!m) {
    const blink = ((t + seed * .77) % 2.6) < .12;
    el.querySelectorAll('.eye').forEach(e => e.style.transform = blink ? 'scaleY(.12)' : '');
  } else el.querySelectorAll('.eye').forEach(e => e.style.transform = '');
}
const human = (id, emoji = '🧑‍💻') => `<div id="${id}" class="a human">${emoji}</div>`;
const doc = (id, title, chip = '', lines = 4, extra = '') => `
  <div id="${id}" class="a card doc" ${extra}>
    <div class="dt"><span>${title}</span>${chip}</div>
    ${Array.from({ length: lines }, (_, i) => `<div class="ln" style="width:${[92, 78, 86, 60, 70][i]}%"></div>`).join('')}
  </div>`;
const ftitle = (id, num, zh, en, desc) => `
  <div id="${id}" class="a ftitle" style="text-align:left">
    <div class="num">${num}</div><div class="zh">${zh}</div><div class="en">${en}</div><div class="desc">${desc}</div>
  </div>`;
// Feature title block slides in from the left, anchored at x=470.
function showTitle(el, u, dur) {
  const p = eo(prog(u, 0, .5));
  place(el, lerp(330, 470, p), 540, 1, 0, p * (1 - prog(u, dur - .3, dur)));
}

// ---------- scenes ----------
const scenes = [];
function scene(a, b, html, render, opts = {}) {
  const el = document.createElement('div');
  el.className = 'scene';
  el.innerHTML = html;
  $('scenes').appendChild(el);
  scenes.push({ a, b, el, render, fi: opts.fi ?? .25, fo: opts.fo ?? .25 });
}

// S1 — "You have an AI agent team." (0 – 4.5)
scene(0, 4.5, `
  <div id="s1t1" class="a h1"></div>
  ${bot('s1b1', COLORS.SCOUT, 'SCOUT')}${bot('s1b2', COLORS.ANALYST, 'ANALYST')}
  ${bot('s1b3', COLORS.AUDITOR, 'AUDITOR')}${bot('s1b4', COLORS.EXECUTOR, 'EXECUTOR')}
  <div id="s1t2" class="a h2">听起来很美好……</div>
`, t => {
  type($('s1t1'), '你有一支 AI Agent 团队。', prog(t, .2, 1.2));
  place($('s1t1'), 960, 250);
  ['s1b1', 's1b2', 's1b3', 's1b4'].forEach((id, i) => {
    const s = pop(t, 1.2 + i * .2);
    const bob = Math.sin(t * 4 + i) * 10;
    place($(id), 960 + (i - 1.5) * 330, 590 + bob, s, Math.sin(t * 3 + i) * 3);
    mood($(id), t, t > 2.8 ? 'happy' : '', i);
  });
  place($('s1t2'), 960, 880, 1, 0, prog(t, 2.8, 3.2));
}, { fi: 0.01 });

// S2 — the five ways it goes wrong (4.5 – 15.5)
const FAILS = ['上下文爆炸', '互相覆盖 · 死锁', '生成 ↔ 审查 乒乓循环', '人类指令被旧逻辑覆盖', '一把共享密钥删光核心数据'];
scene(4.5, 15.5, `
  <div id="s2h" class="a h1">直到它们开始一起干活……</div>
  <div id="s2lab" class="a" style="display:flex;align-items:center;gap:24px">
    <span id="s2n" class="pill" style="background:var(--danger);color:#fff;font-size:34px;padding:8px 24px">翻车 #1</span>
    <span id="s2name" style="font-size:52px;font-weight:700"></span>
  </div>
  <!-- v1 context explosion -->
  <div id="v1">
    ${bot('v1b', COLORS.ANALYST, 'ANALYST')}
    <div id="v1doc" class="a card" style="width:420px;height:300px;padding:30px;background:#1b2130">
      <div style="font-size:28px;color:var(--muted)">context window</div>
      <div id="v1n" class="mono" style="font-size:50px;font-weight:700;margin-top:20px;color:var(--amber)"></div>
      <div class="ln" style="height:14px;border-radius:7px;background:#2a3445;margin-top:30px;width:90%"></div>
      <div class="ln" style="height:14px;border-radius:7px;background:#2a3445;margin-top:20px;width:70%"></div>
    </div>
    <div id="v1boom" class="a" style="font-size:300px">💥</div>
  </div>
  <!-- v2 overwrite / deadlock -->
  <div id="v2">
    ${bot('v2a', COLORS.SCOUT, 'Agent A')}${bot('v2b', COLORS.EXECUTOR, 'Agent B')}
    <div id="v2doc" class="a card doc" style="height:260px">
      <div class="dt"><span>plan.md</span><span class="pill" style="background:#2a3445;color:var(--muted)">v3</span></div>
      <div id="v2txt" style="font-size:40px;font-weight:700;margin-top:40px"></div>
    </div>
    <div id="v2stamp" class="a stamp" style="color:var(--danger)">DEADLOCK 死锁</div>
  </div>
  <!-- v3 ping-pong -->
  <div id="v3">
    ${bot('v3a', COLORS.ANALYST, '生成者')}${bot('v3b', COLORS.AUDITOR, '审查者')}
    <div id="v3ball" class="a" style="width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd27a);box-shadow:0 0 30px #ffb547"></div>
    <div id="v3l" class="a bubble">改好了！</div><div id="v3r" class="a bubble">重写！</div>
    <div id="v3n" class="a mono" style="font-size:64px;font-weight:700;color:var(--amber)"></div>
  </div>
  <!-- v4 human instruction overwritten -->
  <div id="v4">
    ${human('v4h', '🙂')}
    <div id="v4note" class="a" style="width:440px;height:300px;background:#fde68a;color:#3b2f00;border-radius:12px;padding:40px;font-size:50px;font-weight:700;line-height:1.5;box-shadow:0 20px 60px rgba(0,0,0,.5)">周五别上线！<br><span style="font-size:32px">—— 人类</span></div>
    <div id="v4new" class="a" style="width:460px;height:310px;background:#93c5fd;color:#0b2447;border-radius:12px;padding:40px;font-size:50px;font-weight:700;line-height:1.5;box-shadow:0 20px 60px rgba(0,0,0,.5)">照计划上线 🚀<br><span style="font-size:32px">（三天前的逻辑）</span></div>
    ${bot('v4b', COLORS.EXECUTOR, 'EXECUTOR')}
  </div>
  <!-- v5 shared key wipes state -->
  <div id="v5">
    <div id="v5t" class="a term"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <div id="v5body" class="body mono"></div></div>
    <div id="v5x" class="a" style="font-size:80px;font-weight:900;color:var(--danger)">🚨 核心状态已清空 🚨</div>
  </div>
`, t => {
  const u = t - 4.5;
  // header: big centre, then gone
  place($('s2h'), 960, 540, 1, 0, fade(t, 4.5, 5.6, .2, .25));
  const k = clamp(Math.floor((t - 5.5) / 2), 0, 4);
  const lab = t >= 5.5;
  $('s2n').textContent = '翻车 #' + (k + 1);
  $('s2name').textContent = FAILS[k];
  const lp = eo(prog(t, 5.5 + k * 2, 5.5 + k * 2 + .25));
  place($('s2lab'), 960, lerp(90, 130, lp), 1, 0, lab ? lp : 0);

  const show = (id, i) => { const on = t >= 5.5 + i * 2 && t < 7.5 + i * 2; $(id).style.display = on ? '' : 'none'; return t - (5.5 + i * 2); };

  // v1
  let v = show('v1', 0);
  if (v >= 0 && v < 2) {
    const grow = v < 1.6 ? .7 + Math.pow(v / 1.6, 2) * 1.6 : 2.3 + (v - 1.6) * 6;
    place($('v1doc'), 1120, 560, grow, Math.sin(v * 40) * v * 2, v < 1.6 ? 1 : 1 - prog(v, 1.6, 1.75));
    const n = v < 1.55 ? Math.floor(8000 * Math.pow(2, v * 7.2)) : Infinity;
    $('v1n').textContent = (n === Infinity ? '∞' : n.toLocaleString('en-US')) + ' tok';
    place($('v1b'), 520 + Math.sin(v * 50) * v * 6, 600, 1, Math.sin(v * 30) * v * 3);
    mood($('v1b'), t, v > 1.55 ? 'dizzy' : '');
    place($('v1boom'), 1120, 540, pop(v, 1.6, .3) * 1.1, 0, 1 - prog(v, 1.85, 2));
  }
  // v2
  v = show('v2', 1);
  if (v >= 0 && v < 2) {
    const tug = Math.sin(v * 28);
    place($('v2a'), 470 + tug * 25, 600, 1, 8 + tug * 4);
    place($('v2b'), 1450 - tug * 25, 600, 1, -8 - tug * 4);
    mood($('v2a'), t, v > 1.3 ? 'sad' : ''); mood($('v2b'), t, v > 1.3 ? 'sad' : '', 1);
    $('v2txt').textContent = Math.floor(v / .14) % 2 ? 'B：用方案二！' : 'A：用方案一！';
    $('v2txt').style.color = Math.floor(v / .14) % 2 ? 'var(--executor)' : 'var(--scout)';
    place($('v2doc'), 960 + tug * 10, 560, 1, tug * 3);
    const sp = prog(v, 1.3, 1.5);
    place($('v2stamp'), 960, 560, lerp(2.2, 1, eo(sp)), -10, sp);
  }
  // v3
  v = show('v3', 2);
  if (v >= 0 && v < 2) {
    place($('v3a'), 430, 620); place($('v3b'), 1490, 620);
    const per = .25, ph = (v % per) / per, leg = Math.floor(v / per);
    const dir = leg % 2 === 0;
    const bx = lerp(dir ? 560 : 1360, dir ? 1360 : 560, ph);
    place($('v3ball'), bx, 560 - Math.sin(ph * Math.PI) * 220);
    place($('v3l'), 430, 380, 1, -4, dir ? 1 - ph : 0);
    place($('v3r'), 1490, 380, 1, 4, dir ? 0 : 1 - ph);
    $('v3n').textContent = '第 ' + (1 + Math.floor(Math.pow(v / 2, 1.6) * 98)) + ' 轮';
    place($('v3n'), 960, 860);
    mood($('v3a'), t, v > 1.4 ? 'dizzy' : ''); mood($('v3b'), t, v > 1.4 ? 'dizzy' : '', 2);
  }
  // v4
  v = show('v4', 3);
  if (v >= 0 && v < 2) {
    place($('v4h'), 470, 560, pop(v, 0, .3) * (v > 1.05 ? 1.15 : 1), v > 1.05 ? Math.sin(v * 50) * 6 : 0);
    $('v4h').textContent = v > 1.05 ? '😱' : '🙂';
    place($('v4note'), 1050, 560, 1, -3);
    const sl = eo(prog(v, .55, 1.0));
    place($('v4b'), lerp(2050, 1520, eo(prog(v, .3, .8))) + (v > 1.0 ? (v - 1) * 300 : 0), 600, 1, v > 1 ? 10 : -8);
    mood($('v4b'), t, 'happy');
    place($('v4new'), lerp(1700, 1070, sl), lerp(600, 570, sl), 1, lerp(20, 4, sl), sl > 0 ? 1 : 0);
  }
  // v5
  v = show('v5', 4);
  if (v >= 0 && v < 2) {
    const l1 = '$ agent --key=SHARED_ADMIN_KEY', l2 = '> DROP TABLE core_state;';
    const p1 = prog(v, 0, .4), p2 = prog(v, .45, .95);
    $('v5body').innerHTML = l1.slice(0, Math.floor(l1.length * p1)) + (p1 >= 1 ? '\n<span style="color:#ff5370">' + l2.slice(0, Math.floor(l2.length * p2)) + '</span>' : '');
    place($('v5t'), 960, 500);
    place($('v5x'), 960, 820, pop(v, 1.1, .3), Math.sin(v * 60) * 2, v > 1.1 ? 1 : 0);
  }
  // global chaos: red tint, camera shake, glitch
  const heat = prog(t, 5.5, 15.2);
  $('tint').style.opacity = heat * .55 + (t > 14.6 && t < 15.5 ? (Math.floor(t * 20) % 2) * .35 : 0);
  const sh = heat * heat * 14 + (t > 14.6 ? 24 : 0);
  $('scenes').style.transform = `translate(${(rnd(Math.floor(t * 30)) - .5) * sh}px,${(rnd(Math.floor(t * 30) + 9) - .5) * sh}px)`;
  $('scenes').style.filter = t > 14.9 ? `hue-rotate(${rnd(Math.floor(t * 30)) * 180}deg) saturate(2)` : '';
}, { fi: .01, fo: .01 });

// S3 — logo reveal (15.5 – 20)
scene(15.5, 20, `
  <div id="s3q" class="a h2" style="color:var(--text)"></div>
  <svg id="s3logo" class="a" width="300" height="300" viewBox="0 0 64 64" fill="none">
    <rect id="s3tile" x="1" y="1" width="62" height="62" rx="18" fill="#141824" stroke="rgba(255,255,255,.12)"/>
    <path id="s3glow" d="M32 45 45 19" stroke="#8B7CFF" stroke-opacity=".28" stroke-width="13" stroke-linecap="round"/>
    <path id="s3p1" d="M19 19 32 45" stroke="#E8EAF0" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>

    const x = rnd(i + 11) * 1920 + Math.sin(f * 3 + i) * 40, y = -40 + f * (420 + rnd(i + 3) * 320);
    place($('cf' + i), x, y, 1, f * 360 * (rnd(i + 7) - .5) * 2, f > 0 ? 1 : 0);
  }
}, { fo: .35 });

// ---------- driver ----------
const DURATION = 50;
function render(t) {
  // background: violet glow drifts, goes red in the chaos act
  const red = t > 4.5 && t < 15.5;
  $('bgglow').style.background = red
    ? `radial-gradient(ellipse at 50% 60%, rgba(255,60,90,.18), transparent 60%), var(--bg)`
    : `radial-gradient(ellipse at ${50 + Math.sin(t * .4) * 18}% ${45 + Math.cos(t * .3) * 10}%, rgba(139,124,255,.20), transparent 55%), var(--bg)`;
  $('grid').style.transform = `translate(${(t * 12) % 60}px,${(t * 8) % 60}px)`;
  if (!(t > 15.5 && t < 17)) $('flash').style.opacity = 0;
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    s.el.style.display = on ? 'block' : 'none';
    if (on) { s.el.style.opacity = fade(t, s.a, s.b, s.fi, s.fo); s.render(t); }
  }
  // final fade to black
  document.getElementById('stage').style.opacity = 1 - prog(t, DURATION - .5, DURATION);
}
window.render = render;
// Lay out every string the film can show once, so web-font subsets load up front.
$('glyphs').textContent = $('scenes').textContent + FAILS.join('') +
  '∞ tok 第轮 0123456789,→ 已熔断 阈值 round ✓ 已交付 · 附简报 ● SCOUT 认领中 等待认领 😱🙂 veynod 已启动 localhost:8000 $ docker compose up -d agent --key=SHARED_ADMIN_KEY > DROP TABLE core_state; 有没有一种可能…… 你有一支 AI Agent 团队。';
['400', '700', '900'].forEach(w => { const d = document.createElement('div'); d.style.fontWeight = w; d.textContent = $('glyphs').textContent; $('glyphs').appendChild(d); });
window.DURATION = DURATION;

// live preview when opened directly (?t=12 to jump)
if (!navigator.webdriver) {
  const q = +new URLSearchParams(location.search).get('t') || 0;
  const t0 = performance.now() - q * 1000;
  const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else render(0);
</script>
</body>
