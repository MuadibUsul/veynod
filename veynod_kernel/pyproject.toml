[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veynod-kernel"
version = "4.0.0"
description = "Veynod Kernel v4.0 - bipartite contract DAG, disjoint write-set scheduler, deterministic gates"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "maturin>=1.7,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a live PostgreSQL 16 instance (TEST_DATABASE_URL)",
]
