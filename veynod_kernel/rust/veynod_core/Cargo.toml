[package]
name = "veynod_core"
version = "0.1.0"
edition = "2021"
description = "Veynod Kernel core: lock algebra, AST slicer, deterministic command supervisor"
license = "MIT"

[lib]
name = "veynod_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
sha2 = "0.10"
libc = "0.2"
ignore = "0.4"
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
