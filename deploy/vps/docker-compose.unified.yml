# Veynod production (single host) — runtime + kernel planes on the existing db.
#
#   docker compose -f docker-compose.unified.yml --project-name veynod \
#     up -d --no-deps kernel-api kernel-gate runtime-api runtime-worker api
#
# The `db` service is NOT defined here: production runs veynod-db-1 (created by
# the original compose) with three databases in one cluster:
#   veynod (product) / veynod_kernel / veynod_runtime
#
# Networks are the existing ones:
#   agentgraph_internal — api <-> db, and every internal service
#   web                 — api <-> Caddy (Caddy proxies veynod-api:8000)
# Kernel and Runtime are never attached to `web`.

name: veynod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  kernel-api:
    image: veynod-kernel:${VEYNOD_TAG:?VEYNOD_TAG is required}
    container_name: veynod-kernel-api
    # Same repository owner as the gate: loose objects and worktree metadata
    # must never end up root-owned inside the shared bare repos.
    user: "${VN_GATE_DOCKER_USER}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@veynod-db-1:5432/veynod_kernel
      VN_AUTO_INIT_DB: "true"
      VN_AUTH_MODE: prod
      VN_ADMIN_API_KEY: ${KERNEL_ADMIN_KEY:?}
      VN_RUNTIME_SERVICE_KEY: ${KERNEL_SERVICE_KEY:?}
      VN_REQUIRE_BOUND_TOKENS: "true"
      VN_GATE_SANDBOX: docker
      VN_GATE_SANDBOX_IMAGE: veynod-kernel:${VEYNOD_TAG}
      VN_GATE_DOCKER_USER: ${VN_GATE_DOCKER_USER:?set to the repository owner UID:GID}
      VN_GATE_HOST_REPOS_DIR: ${REPOS_DIR:?REPOS_DIR must be absolute}
      VN_GATE_CONTAINER_REPOS_DIR: /repos
      VN_GATE_MEMORY_MB: ${VN_GATE_MEMORY_MB:-2048}
      VN_FAST_FORWARD_MERGE: "true"
      # The mounted repository is owned by the host deploy user; the container
      # runs as root.  Trust the mount instead of failing every git call.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${REPOS_DIR:?REPOS_DIR is required}:/repos
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [agentgraph_internal]
    <<: *logging

  kernel-gate:
    image: veynod-kernel:${VEYNOD_TAG}
    container_name: veynod-kernel-gate
    # Run as the repository owner: worktrees it creates must be writable by
    # the sandbox containers, which the security guard forces to non-root.
    user: "${VN_GATE_DOCKER_USER}"
    # The docker CLI reaches the host socket through the docker group.
    # Numeric: this daemon does not resolve group names for --group-add.
    group_add: ["${VN_GATE_DOCKER_GROUP_GID:?set to the host docker group gid (stat -c %g /var/run/docker.sock)}"]
    command:
      - python
      - -m
      - app.worker
      - --workers
      - ${VN_GATE_WORKERS:-1}
      - --database-url
      - postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@veynod-db-1:5432/veynod_kernel
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@veynod-db-1:5432/veynod_kernel
      VN_AUTO_INIT_DB: "true"
      VN_AUTH_MODE: prod
      VN_ADMIN_API_KEY: ${KERNEL_ADMIN_KEY}
      VN_RUNTIME_SERVICE_KEY: ${KERNEL_SERVICE_KEY}
      VN_GATE_SANDBOX: docker
      VN_GATE_SANDBOX_IMAGE: veynod-kernel:${VEYNOD_TAG}
      VN_GATE_DOCKER_USER: ${VN_GATE_DOCKER_USER:?set to the repository owner UID:GID}
      VN_GATE_HOST_REPOS_DIR: ${REPOS_DIR:?REPOS_DIR must be absolute}
      VN_GATE_CONTAINER_REPOS_DIR: /repos
      TMPDIR: /repos
      VN_GATE_MEMORY_MB: ${VN_GATE_MEMORY_MB:-2048}
      VN_FAST_FORWARD_MERGE: "true"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${REPOS_DIR}:/repos
      - /var/run/docker.sock:/var/run/docker.sock
    # The Gate Worker process serves no HTTP API; its metrics port is the only
    # socket it opens.  The image-level healthcheck (kernel API :8001) does not
    # apply to this command.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/metrics', timeout=4)\""]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      kernel-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [agentgraph_internal]
    <<: *logging

  runtime-api:
    image: veynod-runtime:${VEYNOD_TAG}
    container_name: veynod-runtime-api
    environment:
      RUNTIME_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@veynod-db-1:5432/veynod_runtime
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:?}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [agentgraph_internal]
    <<: *logging

  runtime-worker:
    image: veynod-runtime:${VEYNOD_TAG}
    container_name: veynod-runtime-worker
    command: ["python", "-m", "agent_runtime.worker_main"]
    env_file:
      - path: .env.runtime
        required: false
    environment:
      RUNTIME_ENVIRONMENT: production
      # Model endpoint/key, the runner token and the workspace stay in
      # .env.runtime (env_file above): the product container never sees them.
      RUNTIME_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@veynod-db-1:5432/veynod_runtime
      RUNTIME_MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      RUNTIME_TOOL_MODE: kernel
      KERNEL_URL: http://veynod-kernel-api:8001
      KERNEL_SERVICE_KEY: ${KERNEL_SERVICE_KEY}
      KERNEL_ALLOWED_BASE_URLS: ${KERNEL_ALLOWED_BASE_URLS:-}
      KERNEL_ALLOWED_CREDENTIAL_REFS: ${KERNEL_ALLOWED_CREDENTIAL_REFS:-}
      KERNEL_WORKSPACE_BINDINGS: ${KERNEL_WORKSPACE_BINDINGS:-{}}
      KERNEL_WORKER_HUB_ID: veynod-runtime
      RUNTIME_WORKER_COUNT: ${RUNTIME_WORKER_COUNT:-2}
      RUNTIME_WORKER_LEASE_SECONDS: "120"
      RUNTIME_WORKER_METRICS_PORT: "8031"
      RUNTIME_SUBMISSION_DEADLINE_SECONDS: "3600"
      RUNTIME_CONTEXT_TOKEN_BUDGET: "6000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # The worker serves /metrics on 8031, not the runtime API port.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/metrics', timeout=4)\""]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      runtime-api:
        condition: service_healthy
      kernel-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [agentgraph_internal]
    <<: *logging

  api:
    image: veynod:monorepo-${VEYNOD_TAG}
    container_name: veynod-api
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@veynod-db-1:5432/veynod
      ENVIRONMENT: production
      AUTO_INIT_DB: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MCP_ENABLED: "true"
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-[]}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-[]}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      RLS_ENABLED: "true"
      RLS_ROLE: agentgraph_app
      OUTBOUND_ALLOW_PRIVATE_NETWORKS: "false"
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-[]}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_UPLOAD_COMMAND: ${BACKUP_UPLOAD_COMMAND:-}
      STAGING_DATABASE_URL: ${STAGING_DATABASE_URL:-}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      # The execution planes this product delegates to.
      AGENT_RUNTIME_URL: http://veynod-runtime-api:8002
      AGENT_RUNTIME_KEY: ${RUNTIME_API_KEY}
      AGENT_RUNTIME_PROJECTION_ENABLED: "false"
      KERNEL_URL: http://veynod-kernel-api:8001
      KERNEL_ADMIN_KEY: ${KERNEL_ADMIN_KEY}
      KERNEL_SERVICE_KEY: ${KERNEL_SERVICE_KEY}
      KERNEL_WORKSPACE_ID: ${KERNEL_WORKSPACE_ID:-}
      KERNEL_ALLOWED_BASE_URLS: ${KERNEL_ALLOWED_BASE_URLS:-}
      KERNEL_ALLOWED_CREDENTIAL_REFS: ${KERNEL_ALLOWED_CREDENTIAL_REFS:-}
      KERNEL_WORKSPACE_BINDINGS: ${KERNEL_WORKSPACE_BINDINGS:-{}}
      # Same runner token the runtime worker uses. Stays on the API; the
      # console and the model never see it. Required for worktree leases.
      KERNEL_RUNTIME_TOKEN: ${KERNEL_RUNTIME_TOKEN:-}
      EVENT_DISPATCH_ENABLED: "true"
      INTERNAL_VIEWS_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups/agentgraph}:/backups
    depends_on:
      kernel-api:
        condition: service_healthy
      runtime-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/deep', timeout=6)\""]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks: [agentgraph_internal, web]
    <<: *logging

networks:
  agentgraph_internal:
    external: true
  web:
    external: true
