# Veynod production plane (VPS). Started with --no-deps on an existing db.
#
#   docker compose -f docker-compose.unified.yml --project-name veynod \
#     up -d --no-deps kernel-api kernel-gate runtime-api runtime-worker api
#
# The `db` service is intentionally NOT defined here: production runs
# veynod-db-1 (pgvector/pgvector:pg16) from the original compose, with volume
# veynod_pgdata.  This file only adds the execution planes and re-points `api`
# at them.  All services join the existing docker network so `db` resolves by
# container name.
#
# Three databases in one cluster (bounded contexts):
#   veynod (product) / veynod_kernel / veynod_runtime

name: veynod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  kernel-api:
    image: veynod-kernel:${VEYNOD_TAG:?VEYNOD_TAG is required}
    container_name: veynod-kernel-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veynod}:${POSTGRES_PASSWORD:?}@${DB_HOST:-veynod-db-1}:5432/veynod_kernel
      VN_AUTO_INIT_DB: "true"
      VN_AUTH_MODE: ${VN_AUTH_MODE:-prod}
      VN_ADMIN_API_KEY: ${KERNEL_ADMIN_KEY:?}
      VN_RUNTIME_SERVICE_KEY: ${KERNEL_SERVICE_KEY:?}
      VN_REQUIRE_BOUND_TOKENS: "true"
      VN_GATE_SANDBOX: local
      # Required for several tasks on one repository: HEAD may advance during
      # a gate; the verified patch is tree-merged under CAS instead of being
      # rejected after bounded revalidations (ADR-020).
      VN_FAST_FORWARD_MERGE: "true"
      VN_ALLOW_LOCAL_GATE_IN_PROD: "1"
      VN_GATE_MEMORY_MB: ${VN_GATE_MEMORY_MB:-2048}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${REPOS_DIR:-./repos}:/repos
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [veynod]
    <<: *logging

  kernel-gate:
    image: veynod-kernel:${VEYNOD_TAG}
    container_name: veynod-kernel-gate
    command:
      - python
      - -m
      - app.worker
      - --workers
      - ${VN_GATE_WORKERS:-1}
      - --database-url
      - postgresql+asyncpg://${POSTGRES_USER:-veynod}:${POSTGRES_PASSWORD}@${DB_HOST:-veynod-db-1}:5432/veynod_kernel
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veynod}:${POSTGRES_PASSWORD}@${DB_HOST:-veynod-db-1}:5432/veynod_kernel
      VN_AUTO_INIT_DB: "true"
      VN_AUTH_MODE: ${VN_AUTH_MODE:-prod}
      VN_ADMIN_API_KEY: ${KERNEL_ADMIN_KEY}
      VN_RUNTIME_SERVICE_KEY: ${KERNEL_SERVICE_KEY}
      VN_GATE_SANDBOX: local
      # Required for several tasks on one repository: HEAD may advance during
      # a gate; the verified patch is tree-merged under CAS instead of being
      # rejected after bounded revalidations (ADR-020).
      VN_FAST_FORWARD_MERGE: "true"
      VN_ALLOW_LOCAL_GATE_IN_PROD: "1"
      VN_GATE_MEMORY_MB: ${VN_GATE_MEMORY_MB:-2048}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${REPOS_DIR:-./repos}:/repos
    depends_on:
      kernel-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [veynod]
    <<: *logging

  runtime-api:
    image: veynod-runtime:${VEYNOD_TAG}
    container_name: veynod-runtime-api
    environment:
      RUNTIME_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veynod}:${POSTGRES_PASSWORD}@${DB_HOST:-veynod-db-1}:5432/veynod_runtime
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:?}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [veynod]
    <<: *logging

  runtime-worker:
    image: veynod-runtime:${VEYNOD_TAG}
    container_name: veynod-runtime-worker
    command: ["python", "-m", "agent_runtime.worker_main"]
    environment:
      RUNTIME_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veynod}:${POSTGRES_PASSWORD}@${DB_HOST:-veynod-db-1}:5432/veynod_runtime
      RUNTIME_MODEL_URL: ${MODEL_BASE_URL:?}
      RUNTIME_MODEL_API_KEY: ${MODEL_API_KEY:?}
      RUNTIME_MODEL_NAME: ${MODEL_NAME:?}
      RUNTIME_MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      RUNTIME_TOOL_MODE: kernel
      KERNEL_URL: http://veynod-kernel-api:8001
      KERNEL_RUNTIME_TOKEN: ${KERNEL_RUNTIME_TOKEN:?}
      KERNEL_SERVICE_KEY: ${KERNEL_SERVICE_KEY}
      KERNEL_WORKER_HUB_ID: ${KERNEL_WORKER_HUB_ID:-veynod-runtime}
      RUNTIME_WORKER_COUNT: ${RUNTIME_WORKER_COUNT:-2}
      RUNTIME_WORKER_LEASE_SECONDS: ${RUNTIME_WORKER_LEASE_SECONDS:-120}
      RUNTIME_SUBMISSION_DEADLINE_SECONDS: ${RUNTIME_SUBMISSION_DEADLINE_SECONDS:-3600}
      RUNTIME_CONTEXT_TOKEN_BUDGET: ${RUNTIME_CONTEXT_TOKEN_BUDGET:-6000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      runtime-api:
        condition: service_healthy
      kernel-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [veynod]
    <<: *logging

  api:
    image: veynod-api:${VEYNOD_TAG}
    container_name: veynod-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veynod}:${POSTGRES_PASSWORD}@${DB_HOST:-veynod-db-1}:5432/veynod
      ENVIRONMENT: production
      AUTO_INIT_DB: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      AGENT_RUNTIME_URL: http://veynod-runtime-api:8002
      AGENT_RUNTIME_KEY: ${RUNTIME_API_KEY}
      AGENT_RUNTIME_PROJECTION_ENABLED: "false"
      KERNEL_URL: http://veynod-kernel-api:8001
      KERNEL_ADMIN_KEY: ${KERNEL_ADMIN_KEY}
      KERNEL_SERVICE_KEY: ${KERNEL_SERVICE_KEY}
      KERNEL_WORKSPACE_ID: ${KERNEL_WORKSPACE_ID:-}
      EVENT_DISPATCH_ENABLED: "true"
      INTERNAL_VIEWS_ENABLED: ${INTERNAL_VIEWS_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      kernel-api:
        condition: service_healthy
      runtime-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/deep', timeout=6)\""]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks: [veynod]
    <<: *logging

networks:
  veynod:
    name: ${VEYNOD_DOCKER_NETWORK:-veynod_default}
    external: true
