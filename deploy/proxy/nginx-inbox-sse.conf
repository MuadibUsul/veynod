# Inbox and workspace SSE. Include this inside the veynod.com server block,
# ahead of the generic `location /` proxy. Production previously cut idle
# streams (502) because buffering and the default 60s proxy_read_timeout
# outlived a quiet inbox. The app emits a `: ping` comment about every 20s;
# these timeouts stay at 3600s so one missed beat does not drop the agent.
#
# `Connection ""` is the HTTP/1.1 keepalive form: the header is sent empty so
# it is not a hop-by-hop close.

location /v1/inbox/stream {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://veynod_api;
}

location /v1/stream {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://veynod_api;
}

location ~ ^/v1/admin/workspaces/[^/]+/stream$ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://veynod_api;
}
