<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veynod · Agent Runs</title>
  <style>
    :root { --ink:#0b0f14; --panel:#12171e; --line:#1f2630; --text:#f2f4f7; --muted:#8590a2; --cyan:#00c2ff; --green:#47cd89; --amber:#fdb022; --red:#f97066; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ink); color:var(--text); font:13px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
    header { display:flex; align-items:center; gap:14px; padding:16px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(11,15,20,.92); backdrop-filter:blur(10px); }
    .brand { color:var(--cyan); font-weight:700; letter-spacing:.02em; }
    .spacer { flex:1; }
    a { color:var(--cyan); text-decoration:none; }
    main { max-width:1100px; margin:0 auto; padding:24px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
    h2 { margin:0 0 12px; color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
    input, textarea { width:100%; background:#0a0f14; color:var(--text); border:1px solid var(--line); border-radius:7px; padding:8px 10px; font:inherit; margin-bottom:10px; }
    button { background:var(--cyan); color:var(--ink); border:0; border-radius:7px; padding:8px 14px; font-weight:600; cursor:pointer; margin-right:8px; }
    button.secondary { background:#243040; color:var(--text); }
    button:disabled { opacity:.5; cursor:default; }
    pre { white-space:pre-wrap; background:#0a0f14; border:1px solid var(--line); border-radius:8px; padding:12px; color:#b8c7d9; font-size:12px; min-height:220px; }
    .muted { color:var(--muted); }
    .error { color:var(--red); }
    .ok { color:var(--green); }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header>
  <span class="brand">veynod</span><strong>Agent Runs</strong>
  <span class="spacer"></span>
  <a href="/dashboard/">← Console</a>
</header>
<main>
  <div id="auth" class="card" style="display:none">
    <h2>Session</h2>
    <p class="muted">请先在 Veynod 控制台登录；Agent Runs 复用同一个人类会话。</p>
    <a href="/dashboard/login/"><button type="button">去登录</button></a>
  </div>
  <div id="app" style="display:none">
    <div class="grid">
      <section class="card">
        <h2>Start an Agent Run</h2>
        <form id="start">
          <label>Product task key</label>
          <input name="task_key" required placeholder="TASK-..." />
          <label>Max model calls</label>
          <input name="max_model_calls" type="number" value="6" min="1" max="100" />
          <label>Max cost USD</label>
          <input name="max_cost_usd" type="number" value="0.5" min="0" step="0.01" />
          <button type="submit">Start Agent Run →</button>
          <button type="button" id="cancel" class="secondary" disabled>Cancel</button>
          <div id="error" class="error"></div>
        </form>
      </section>
      <section class="card">
        <h2>Run detail</h2>
        <pre id="detail">输入产品任务 key，启动一个持久化 Agent Run。</pre>
      </section>
    </div>
  </div>
</main>
<script>
  const SESSION_KEY = 'agentgraph.session_token';
  const token = localStorage.getItem(SESSION_KEY) || '';
  const auth = document.getElementById('auth');
  const app = document.getElementById('app');
  if (!token) {
    auth.style.display = 'block';
  } else {
    app.style.display = 'block';
  }
  let currentTask = '';
  let timer = null;
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers || {}) },
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error ? body.error.message : (body.detail ? JSON.stringify(body.detail) : `HTTP ${response.status}`));
    return body;
  }
  async function poll() {
    if (!currentTask || !token) return;
    try {
      const run = await api(`/v1/tasks/${encodeURIComponent(currentTask)}/agent-run`);
      document.getElementById('detail').textContent = JSON.stringify(run, null, 2);
      const terminal = ['REVIEWING','FAILED','CANCELLED','DONE'].includes(run.agentgraph_status);
      if (terminal) {
        clearInterval(timer); timer = null;
        document.getElementById('cancel').disabled = true;
      }
    } catch (error) {
      document.getElementById('detail').innerHTML = `<span class="error">${esc(error.message)}</span>`;
    }
  }
  document.getElementById('start').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = new FormData(event.target);
    const task = String(form.get('task_key') || '').trim();
    if (!task) return;
    currentTask = task;
    document.getElementById('error').textContent = '';
    document.getElementById('detail').textContent = 'starting…';
    const budget = {
      max_model_calls: Number(form.get('max_model_calls') || 6),
      max_cost_usd: Number(form.get('max_cost_usd') || 0.5),
    };
    try {
      const run = await api(`/v1/tasks/${encodeURIComponent(task)}/agent-run`, {
        method: 'POST', body: JSON.stringify({ budget }),
      });
      document.getElementById('detail').textContent = JSON.stringify(run, null, 2);
      document.getElementById('cancel').disabled = false;
      if (timer) clearInterval(timer);
      timer = setInterval(poll, 3000);
    } catch (error) {
      document.getElementById('detail').innerHTML = `<span class="error">${esc(error.message)}</span>`;
    }
  });
  document.getElementById('cancel').addEventListener('click', async () => {
    if (!currentTask) return;
    try {
      const run = await api(`/v1/tasks/${encodeURIComponent(currentTask)}/agent-run/cancel`, {
        method: 'POST', body: JSON.stringify({ reason: 'Cancelled from Agent Runs page' }),
      });
      document.getElementById('detail').textContent = JSON.stringify(run, null, 2);
      document.getElementById('cancel').disabled = true;
    } catch (error) {
      document.getElementById('detail').innerHTML = `<span class="error">${esc(error.message)}</span>`;
    }
  });
</script>
</body>
</html>
